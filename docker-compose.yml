version: '3.8'

services:
  # ==========================================
  # 1. BASE DE DATOS: MySQL 8.0
  # ==========================================
  mysqldb:
    image: mysql:8.0
    container_name: sonidovivo-mysql
    restart: always
    environment:
      MYSQL_DATABASE: sonido_vivo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Carga automática del script SQL al iniciar por primera vez el contenedor
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - red-sonidovivo
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. BACKEND: Spring Boot 3 API REST + JWT
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sonidovivo-backend
    restart: always
    depends_on:
      mysqldb:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/sonido_vivo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      APP_JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      APP_JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    networks:
      - red-sonidovivo

  # ==========================================
  # 3. FRONTEND: React SPA + Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sonidovivo-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - red-sonidovivo

volumes:
  mysql_data:

networks:
  red-sonidovivo:
    driver: bridge
